name: Check LoadShift
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra test
      - run: uv run --frozen pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
