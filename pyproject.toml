[project]
name = "loadshift"
version = "0.1.0"
description = "Household deferrable-load coach for solar homes without complex Home Assistant"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Yun Fang" }]
dependencies = [
    "numpy>=2.0.0,<2.3.0",
    "scipy>=1.15.0",
    "pandas>=2.2.0",
    "pytz>=2024.2",
    "highspy>=1.10.0",
    "cvxpy>=1.6.0,<1.8.0",
    "pyyaml>=6.0.2",
    "orjson>=3.10.0",
    "plotly>=6.0.0",
    "scikit-learn>=1.5.0",
    "aiohttp>=3.10.0",
    "aiofiles>=24.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
loadshift = "loadshift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loadshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.hatch.build.targets.wheel.force-include]
"web" = "loadshift/assets/web"
"fixtures" = "loadshift/assets/fixtures"
